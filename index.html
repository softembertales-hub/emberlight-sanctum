<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Emberlight Sanctum</title>
  <link rel="icon" href="assets/logos/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=IM+Fell+English:ital@0;1&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div id="atmosphere" aria-hidden="true"><div id="atmoMedia"></div><div id="atmoTint"></div><div id="grain"></div><canvas id="particles"></canvas></div>
  <div id="app"></div>

  <form name="sanctum-contact" method="POST" data-netlify="true" netlify netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="sanctum-contact">
    <input name="bot-field">
    <input type="text" name="name">
    <input type="email" name="email">
    <input type="text" name="reason">
    <input type="text" name="replyRequested">
    <input type="text" name="recordTitle">
    <input type="text" name="recordUrl">
    <input type="text" name="decree">
    <textarea name="message"></textarea>
  </form>

  <audio id="globalAudio" loop></audio>
  <audio id="transitionAudio"></audio>
  <script src="assets/js/shared.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
