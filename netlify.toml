[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/archives"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/records/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
